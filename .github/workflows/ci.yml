name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test (unit, integration, TUI smoke)
        run: cd build && ctest --output-on-failure
